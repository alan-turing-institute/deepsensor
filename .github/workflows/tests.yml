name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * 2" # run weekly tests

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
    - name: Print space
      run: df -h
    
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install .[test]

    - name: Install dependencies (include tensorflow for python <= 3.13)
      if: matrix.python-version <= '3.13'
      run: |
        pip install "tensorflow" "tensorflow_probability[tf]"
        # use cpu only torch to avoid triton in ci
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install dependencies (no tensorflow for python > 3.13)
      if: matrix.python-version > '3.13'
      run: |
        # use cpu only torch to avoid triton in ci
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Test with pytest
      run: pytest
    - name: Run coveralls
      run: coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.test-name }}
        COVERALLS_PARALLEL: true


  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Finish Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
