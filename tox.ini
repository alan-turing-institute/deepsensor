[tox]
minversion = 3.10.0
envlist = py3.11, py3.12, py3.13, py3.14
isolated_build = true

[gh-actions]
python =
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    .[tf,torch,test]
commands =
    pytest --basetemp={envtmpdir}
